version: "3.8"

services:
  threatgraphrag-web:
    build: .
    container_name: threatgraphrag_web
    ports:
      - "8501:8501"
    env_file:
      - .env
    restart: unless-stopped
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0

  threatgraphrag-api:
    build: .
    container_name: threatgraphrag_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped
    command: uvicorn api:app --host 0.0.0.0 --port 8000
